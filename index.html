<!DOCTYPE html>
<!--
    🎬 ПОИСКОВИК ФИЛЬМОВ
    
    ⚠️ ВАЖНО! Перед запуском:
    1. Получите БЕСПЛАТНЫЙ API ключ: https://www.omdbapi.com/apikey.aspx
    2. Откройте script.js и замените YOUR_API_KEY на ваш ключ
    3. Подробная инструкция в файле SETUP.md
    
    Без API ключа приложение не будет работать!
-->
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поисковик фильмов</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="header__title">🎬 Поисковик фильмов</h1>
            <div class="search">
                <div class="search__wrapper">
                    <input 
                        type="text" 
                        class="search__input" 
                        id="searchInput" 
                        placeholder="Введите название фильма..."
                        autocomplete="off"
                        autofocus
                    >
                    <button class="search__clear" id="clearBtn" aria-label="Очистить поиск">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <button class="search__btn" id="searchBtn" aria-label="Поиск">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="2"/>
                            <path d="M14 14L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="filters">
                <label class="filter">
                    <span class="filter__label">Тип:</span>
                    <select class="filter__select" id="typeFilter">
                        <option value="">Все</option>
                        <option value="movie">Фильмы</option>
                        <option value="series">Сериалы</option>
                        <option value="episode">Эпизоды</option>
                    </select>
                </label>
                <label class="filter">
                    <span class="filter__label">Год:</span>
                    <input type="number" class="filter__input" id="yearFilter" placeholder="Например, 2024" min="1900" max="2025">
                </label>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="loader" id="loader">
                <div class="loader__spinner"></div>
                <p class="loader__text">Загрузка...</p>
            </div>
            
            <div class="message" id="message"></div>
            
            <section class="movies" id="moviesContainer">
                <!-- Карточки фильмов будут добавлены через JavaScript -->
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="footer__text">
                © 2025 | 
                <a href="https://github.com/yourusername" class="footer__link" target="_blank" rel="noopener noreferrer">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10 0C4.477 0 0 4.477 0 10c0 4.42 2.865 8.17 6.84 9.49.5.09.68-.22.68-.48 0-.24-.01-1.02-.01-1.85-2.5.46-3.16-.61-3.36-1.17-.11-.28-.6-1.17-1.02-1.4-.35-.19-.85-.66-.01-.67.79-.01 1.35.72 1.54 1.02.9 1.52 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.93 0-1.09.39-1.99 1.02-2.69-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02.8-.22 1.65-.33 2.5-.33.85 0 1.7.11 2.5.33 1.91-1.3 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.63.7 1.02 1.6 1.02 2.69 0 3.83-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85 0 1.34-.01 2.42-.01 2.75 0 .26.18.58.69.48A10.001 10.001 0 0020 10c0-5.523-4.477-10-10-10z"/>
                    </svg>
                    GitHub
                </a>
            </p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
